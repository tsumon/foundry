name: Desktop packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_sources_run_id:
        description: Optional same-repository run containing foundry-runtime-sources; every input is reverified against this checkout
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  runtime-sources:
    name: Pinned native runtime source sidecar
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      macos_installer: ${{ steps.package-metadata.outputs.macos_installer }}
      windows_installer: ${{ steps.package-metadata.outputs.windows_installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install source verifier without Electron install scripts
        run: npm ci --prefix desktop --ignore-scripts
      - name: Read installer names from the package version
        id: package-metadata
        run: |
          node -e '
            const fs = require("node:fs");
            const { version } = require("./desktop/package.json");
            if (typeof version !== "string" || /[\r\n]/.test(version) || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version))
              throw new Error("Invalid desktop package version");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `macos_installer=Foundry-${version}-arm64.dmg\nwindows_installer=Foundry-${version}-x64.exe\n`);
          '
      - name: Fetch each immutable source once and check every digest
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runtime_sources_run_id == '' }}
        run: |
          node desktop/runtime-sources.cjs "$RUNNER_TEMP/foundry-runtime-sources"
          node desktop/runtime-sources.cjs "$RUNNER_TEMP/foundry-runtime-sources/installer" installer
      - name: Read explicitly selected source artifact from this repository
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_sources_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: foundry-runtime-sources
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_sources_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/foundry-runtime-source-input
      - name: Reverify every reused runtime and installer input with current pinned manifests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_sources_run_id != '' }}
        env:
          FOUNDRY_RUNTIME_SOURCES: ${{ runner.temp }}/foundry-runtime-source-input
        run: |
          set -eu
          node desktop/runtime-sources.cjs "$RUNNER_TEMP/foundry-runtime-sources"
          FOUNDRY_RUNTIME_SOURCES="$FOUNDRY_RUNTIME_SOURCES/installer" \
            node desktop/runtime-sources.cjs "$RUNNER_TEMP/foundry-runtime-sources/installer" installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundry-runtime-sources
          if-no-files-found: error
          path: ${{ runner.temp }}/foundry-runtime-sources/

  macos-installer:
    name: macOS arm64 package and installed contracts (not VM execution)
    needs: runtime-sources
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      GOENV: "off"
      GOTELEMETRY: "off"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: foundry-runtime-sources
          path: ${{ runner.temp }}/foundry-runtime-sources
      - name: Install exact locked build inputs
        run: |
          set -eu
          npm ci --prefix web
          npm ci --prefix desktop
          node desktop/node_modules/electron/install.js
          go mod download
          go mod verify
      - name: Desktop boundaries and real Electron download contract
        run: |
          set -eu
          npm test --prefix desktop
          desktop/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron desktop/test/download-contract.cjs patch
          desktop/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron desktop/test/download-contract.cjs report
      - name: Assemble pinned sandbox and corresponding-source sidecar (no VM boot)
        id: sandbox-bundle
        run: |
          set -eu
          export FOUNDRY_GO="$(command -v go)"
          node desktop/sandbox/build.cjs "$RUNNER_TEMP/foundry-macos-sandbox"
      - name: Build native ad-hoc app and DMG without signing-account discovery
        id: desktop-package
        run: |
          set -eu
          export FOUNDRY_DESKTOP_OUTPUT="$RUNNER_TEMP/foundry-macos-output"
          export FOUNDRY_SANDBOX_BUNDLE="$RUNNER_TEMP/foundry-macos-sandbox/bundle"
          node desktop/build.cjs
          cp -R "$RUNNER_TEMP/foundry-runtime-sources" "$FOUNDRY_DESKTOP_OUTPUT/runtime-sources"
          cp -R "$RUNNER_TEMP/foundry-macos-sandbox/sandbox-sources" "$FOUNDRY_DESKTOP_OUTPUT/sandbox-sources"
      - name: Installed backend contracts and persistence (no hardware VM acceptance)
        id: installed-contract
        env:
          FOUNDRY_MAC_INSTALLER: ${{ needs.runtime-sources.outputs.macos_installer }}
        run: |
          set -eu
          output="$RUNNER_TEMP/foundry-macos-output"
          mountpoint="$RUNNER_TEMP/foundry-mount"
          install="$RUNNER_TEMP/Foundry Installed"
          mkdir "$mountpoint" "$install"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$output/$FOUNDRY_MAC_INSTALLER"
          trap 'hdiutil detach "$mountpoint"' EXIT
          ditto "$mountpoint/Foundry.app" "$install/Foundry.app"
          codesign --verify --deep --strict "$install/Foundry.app"
          export FOUNDRY_INSTALLED_RESOURCES="$install/Foundry.app/Contents/Resources"
          export FOUNDRY_SMOKE_DATA="$RUNNER_TEMP/foundry-installed-data"
          node desktop/installed-smoke.cjs > "$output/native-smoke.json"
      - name: Upload after package contracts; physical Mac VM acceptance remains separate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundry-macos-arm64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/foundry-macos-output/${{ needs.runtime-sources.outputs.macos_installer }}
            ${{ runner.temp }}/foundry-macos-output/SHA256SUMS
            ${{ runner.temp }}/foundry-macos-output/build-inputs.json
            ${{ runner.temp }}/foundry-macos-output/native-smoke.json
            ${{ runner.temp }}/foundry-macos-output/runtime-sources/
            ${{ runner.temp }}/foundry-macos-output/sandbox-sources/

  windows-installer:
    name: Native Windows x64 installer and acceptance
    needs: runtime-sources
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: "1"
      CC: 'C:\mingw64\bin\gcc.exe'
      GOTOOLCHAIN: local
      GOENV: "off"
      GOTELEMETRY: "off"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: foundry-runtime-sources
          path: ${{ runner.temp }}/foundry-runtime-sources
      - name: Native compiler and trusted Git prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& $env:CC -dumpmachine).Trim() -ne 'x86_64-w64-mingw32') { throw 'Native x64 MinGW required' }
          if (-not ((& $env:CC -dumpfullversion).Trim().StartsWith('15.2'))) { throw 'GCC 15.2 required' }
          if (-not (Test-Path 'C:\Program Files\Git\cmd\git.exe')) { throw 'Official Git for Windows required' }
          if ((npm --version).Trim() -ne '10.9.8') { throw 'npm 10.9.8 required' }
          go version
          if ($LASTEXITCODE -ne 0) { throw 'Go unavailable' }
      - name: Read-only WHPX host prerequisite (never enables features)
        id: whpx-preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'foundry-whpx-probe.exe'
          if (Test-Path -LiteralPath $probe) { throw 'Fresh probe output required' }
          & $env:CC -std=c11 -Wall -Wextra -Werror -Os -static-libgcc desktop/windows-hypervisor-probe.c -o $probe
          if ($LASTEXITCODE -ne 0) { throw 'Native WHPX probe compilation failed' }
          node desktop/native-vm-smoke.cjs --windows-hypervisor-preflight $probe
          if ($LASTEXITCODE -ne 0) { throw 'Native WHPX prerequisite unavailable; no fallback or package publication' }
      - name: Prepare long-form native temporary directory
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeTemp = Join-Path $env:RUNNER_TEMP 'Foundry Native Temp'
          if (-not [System.IO.Path]::IsPathFullyQualified($nativeTemp) -or $nativeTemp.Contains('~')) { throw 'An explicit long-form temporary path is required' }
          if (Test-Path -LiteralPath $nativeTemp) { throw 'Native temporary directory already exists' }
          New-Item -ItemType Directory -Path $nativeTemp | Out-Null
          @("TEMP=$nativeTemp", "TMP=$nativeTemp") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install locked dependencies
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE -ne 0) { throw 'web install failed' }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'desktop install failed' }
          node desktop/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime install failed' }
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Go dependencies failed' }
      - name: Build and verify native private upgrade copy helper
        id: upgrade-copy
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:RUNNER_TEMP 'foundry-upgrade-copy.exe'
          if (Test-Path $helper) { throw 'Upgrade copy helper output must be fresh' }
          $env:CGO_ENABLED = '0'
          go build -o $helper ./desktop
          if ($LASTEXITCODE -ne 0) { throw 'Native private upgrade copy helper build failed' }
          go test -count=1 -run '^TestWindowsUpgradePrivateCopyAndRestore$' ./desktop
          if ($LASTEXITCODE -ne 0) { throw 'Native private upgrade copy/restore regression failed' }
          "FOUNDRY_UPGRADE_COPY=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Native CGO commands and Windows boundary/integration gates
        run: ./desktop/windows-test.ps1
      - name: Isolated Windows Credential Manager diagnostic lifecycle
        run: |
          $env:FOUNDRY_WINDOWS_CREDENTIAL_MANAGER_NATIVE_CI = '1'
          try {
            go test -count=1 -run '^TestWindowsCredentialManagerNativeCIProbe$' ./internal/model
            if ($LASTEXITCODE -ne 0) { throw 'Native Credential Manager diagnostic failed' }
          } finally {
            Remove-Item Env:FOUNDRY_WINDOWS_CREDENTIAL_MANAGER_NATIVE_CI -ErrorAction SilentlyContinue
          }
      - name: Audit Windows-specific reachable Go dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'foundry-security-tools'
          $toolSource = Join-Path $env:RUNNER_TEMP 'foundry-security-source'
          New-Item -ItemType Directory -Path $toolSource | Out-Null
          Push-Location $toolSource
          try {
            $module = (& go mod download -json golang.org/x/vuln@v1.9.0) | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'govulncheck source unavailable' }
            if ($module.Sum -cne 'h1:12VaqnI9kJfqwRoPptxoqsUhQtdfrSbdksT7X/KY/sc=' -or $module.GoModSum -cne 'h1:E/Frwm0xp49fTyBW+6CQHdkvobknbwUM49yEpMGUauw=') { throw 'govulncheck checksum mismatch' }
            go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            if ($LASTEXITCODE -ne 0) { throw 'govulncheck build failed' }
          } finally { Pop-Location }
          & (Join-Path $env:GOBIN 'govulncheck.exe') -show=verbose ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows vulnerability audit failed' }
      - name: Build pinned minimal QEMU with WHPX only in a dedicated build environment
        id: windows-vm-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $buildHost = Join-Path $env:RUNNER_TEMP 'foundry-windows-vm-buildhost'
          $runtimeOutput = Join-Path $env:RUNNER_TEMP 'foundry-windows-vm-runtime'
          node desktop/sandbox/windows-source-build.cjs --bootstrap $buildHost
          if ($LASTEXITCODE -ne 0) { throw 'Pinned VM build host bootstrap failed' }
          node desktop/sandbox/windows-source-build.cjs $runtimeOutput (Join-Path $buildHost 'msys64') --install-pinned-build-packages
          if ($LASTEXITCODE -ne 0) { throw 'Minimal WHPX runtime source build failed' }
      - name: Assemble pinned Windows sandbox and corresponding-source sidecar
        id: sandbox-bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FOUNDRY_GO = (Get-Command go).Source
          $env:FOUNDRY_WINDOWS_VM_RUNTIME = Join-Path $env:RUNNER_TEMP 'foundry-windows-vm-runtime'
          node desktop/sandbox/build.cjs (Join-Path $env:RUNNER_TEMP 'foundry-windows-sandbox')
          if ($LASTEXITCODE -ne 0) { throw 'Windows sandbox assembly failed' }
      - name: Build per-user unsigned NSIS installer
        id: desktop-package
        run: |
          $env:FOUNDRY_DESKTOP_OUTPUT = Join-Path $env:RUNNER_TEMP 'foundry-windows-output'
          $env:FOUNDRY_SANDBOX_BUNDLE = Join-Path $env:RUNNER_TEMP 'foundry-windows-sandbox/bundle'
          node desktop/build-windows.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'foundry-runtime-sources') (Join-Path $env:FOUNDRY_DESKTOP_OUTPUT 'runtime-sources') -Recurse
          Copy-Item (Join-Path $env:RUNNER_TEMP 'foundry-windows-sandbox/sandbox-sources') (Join-Path $env:FOUNDRY_DESKTOP_OUTPUT 'sandbox-sources') -Recurse
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5237fc49bafe4c5d33d3d6fa117ac59c467ace16
          path: release-alpha3-source
          persist-credentials: false
      - name: Seed independent synthetic alpha.3 task and fetch pinned public installer
        run: |
          $ErrorActionPreference = 'Stop'
          $seed = Join-Path $env:RUNNER_TEMP 'foundry-upgrade-seed'
          if (Test-Path $seed) { throw 'Upgrade seed root must be fresh' }
          Copy-Item desktop/test/upgrade-seed.go.txt release-alpha3-source/internal/engine/release_upgrade_seed_test.go
          Push-Location release-alpha3-source
          try {
            $env:FOUNDRY_UPGRADE_SEED_ROOT = $seed
            go test -count=1 -run '^TestReleaseUpgradeSeed$' ./internal/engine
            if ($LASTEXITCODE -ne 0) { throw 'Pinned alpha.3 synthetic seed failed' }
          } finally { Pop-Location; Remove-Item Env:FOUNDRY_UPGRADE_SEED_ROOT -ErrorAction SilentlyContinue }
          if (-not (Test-Path (Join-Path $seed 'fixture.json'))) { throw 'Synthetic upgrade fixture missing' }
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'Foundry-0.1.0-alpha.3-x64.exe'
          if (Test-Path $oldInstaller) { throw 'Old installer output must be fresh' }
          Invoke-WebRequest 'https://github.com/tsumon/foundry/releases/download/v0.1.0-alpha.3/Foundry-0.1.0-alpha.3-x64.exe' -OutFile $oldInstaller
          if ((Get-FileHash $oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne '023bf7e0c95b3ec90e76e429b145e9fbbe0b1d52103ec82e5ac4eb3968188327') { throw 'Pinned alpha.3 installer digest mismatch' }
      - name: Alpha.3 over-install, mandatory WHPX guest, native UI, restart, and uninstall
        id: installed-contract
        run: ./desktop/windows-installed-smoke.ps1 -Output (Join-Path $env:RUNNER_TEMP 'foundry-windows-output') -OldInstaller (Join-Path $env:RUNNER_TEMP 'Foundry-0.1.0-alpha.3-x64.exe') -UpgradeFixture (Join-Path $env:RUNNER_TEMP 'foundry-upgrade-seed/fixture.json')
      - name: Upload only after every native gate passes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundry-windows-x64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/foundry-windows-output/${{ needs.runtime-sources.outputs.windows_installer }}
            ${{ runner.temp }}/foundry-windows-output/SHA256SUMS
            ${{ runner.temp }}/foundry-windows-output/build-inputs.json
            ${{ runner.temp }}/foundry-windows-output/native-smoke.json
            ${{ runner.temp }}/foundry-windows-output/upgrade-old-installed.json
            ${{ runner.temp }}/foundry-windows-output/upgrade-acceptance.json
            ${{ runner.temp }}/foundry-windows-output/fresh-candidate-integrity.json
            ${{ runner.temp }}/foundry-windows-output/native-vm-acceptance.json
            ${{ runner.temp }}/foundry-windows-output/windows-ui.png
            ${{ runner.temp }}/foundry-windows-output/windows-ui-coding.png
            ${{ runner.temp }}/foundry-windows-output/windows-ui-return.png
            ${{ runner.temp }}/foundry-windows-output/windows-ui-restart.png
            ${{ runner.temp }}/foundry-windows-output/nsis-provenance.json
            ${{ runner.temp }}/foundry-windows-output/nsis-installer-compiler.log
            ${{ runner.temp }}/foundry-windows-output/nsis-uninstaller-compiler.log
            ${{ runner.temp }}/foundry-windows-output/foundry-pe-imports.txt
            ${{ runner.temp }}/foundry-windows-output/foundry-acceptance-pe-imports.txt
            ${{ runner.temp }}/foundry-windows-output/foundry-vm-acceptance-pe-imports.txt
            ${{ runner.temp }}/foundry-windows-output/shipping-provenance.json
            ${{ runner.temp }}/foundry-windows-output/runtime-sources/
            ${{ runner.temp }}/foundry-windows-output/sandbox-sources/
